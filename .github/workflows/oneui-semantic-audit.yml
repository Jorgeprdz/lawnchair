name: OneUI semantic preservation audit

on:
  push:
    branches: [audit/oneui-16dev-20260915]
    paths: ['.github/workflows/oneui-semantic-audit.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_SHA: f8164291da70339b515b41e4230e4c24da9d8557
  ONEUI_BASE_SHA: 1a5e02c524179875c2784e9c871abf660a5b1608

jobs:
  audit:
    name: Reconstruct merge and audit OneUI modules
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact OneUI base
        uses: actions/checkout@v7
        with:
          ref: ${{ env.ONEUI_BASE_SHA }}
          fetch-depth: 0
          submodules: false
      - name: Reconstruct exact candidate merge
        run: |
          set -euo pipefail
          git remote add lawnchair-upstream https://github.com/LawnchairLauncher/lawnchair.git || true
          git fetch --no-tags lawnchair-upstream "$UPSTREAM_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-edit --no-ff -X ours "$UPSTREAM_SHA" -m "audit: reconstruct OneUI 16-dev candidate"
          test -z "$(git ls-files -u)"
          git merge-base --is-ancestor "$ONEUI_BASE_SHA" HEAD
          git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD
          ! git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- ':!*.md'
      - name: Synchronize merged submodules
        run: |
          set -euo pipefail
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 4
      - name: Audit all OneUI modules with per-check diagnostics
        id: semantic
        shell: bash
        run: |
          set +e
          FAIL=0
          check() { local mod="$1" label="$2"; shift 2; if "$@" >/dev/null 2>&1; then printf '  PASS  %s\n' "$label"; else printf '  FAIL  %s\n' "$label"; FAIL=1; fi; }
          section() { printf '\n===== %s =====\n' "$1"; }
          section 'M1 LARGE FOLDERS'
          check M1 FLAG_LARGE_FOLDER git grep -q FLAG_LARGE_FOLDER
          check M1 large_folder_refs bash -c "git grep -qi 'large.folder'"
          check M1 FolderIcon git grep -q FolderIcon
          section 'M2 PIXEL SEARCH'
          check M2 pixel_package git grep -q rk.android.app.pixelsearch
          check M2 PixelSearchQsbFragment git grep -q PixelSearchQsbFragment
          check M2 pixel_search_pref git grep -q pixel_search
          section 'M3 ONE UI FINDER'
          check M3 samsung_launcher git grep -q com.sec.android.app.launcher
          check M3 finder_refs bash -c "git grep -qi finder"
          section 'M4 DOCK/FOLDER GLASS'
          check M4 OneUiGlassPreferences test -f lawnchair/src/app/lawnchair/oneui/OneUiGlassPreferences.kt
          check M4 DockGlassBackground test -f src/com/android/launcher3/graphics/DockGlassBackground.java
          check M4 STYLE_BLUR git grep -q STYLE_BLUR -- lawnchair/src/app/lawnchair/oneui src/com/android/launcher3/graphics
          check M4 STYLE_CRYSTAL git grep -q STYLE_CRYSTAL -- lawnchair/src/app/lawnchair/oneui src/com/android/launcher3/graphics
          check M4 frosty_refs bash -c "git grep -qi frost -- lawnchair/src/app/lawnchair/oneui src/com/android/launcher3/graphics"
          for token in dock_blur_intensity dock_crystal_intensity folder_blur_intensity folder_crystal_intensity; do check M4 "$token" git grep -q "$token"; done
          section 'M5 WIDGET GRID SNAP'
          check M5 WidgetGridPreflight git grep -q WidgetGridPreflight
          check M5 WidgetGridMigrationGuard git grep -q WidgetGridMigrationGuard
          check M5 grid_migration bash -c "git grep -qiE 'grid.*migration|migration.*grid'"
          section 'M6 WIDGET STACKS'
          for token in WidgetStackInfo WidgetStackView WidgetStackController WidgetStackEditor; do check M6 "$token" git grep -q "$token"; done
          section 'M7 MAX ICONS/FOLDERS'
          check M7 FLAG_MAX_ICON git grep -q FLAG_MAX_ICON
          check M7 WORKSPACE_SIZE git grep -q WORKSPACE_SIZE
          check M7 FLAG_LARGE_FOLDER git grep -q FLAG_LARGE_FOLDER
          section 'IDENTITY/SIGNING CONTRACT'
          check ID oneui_build test -f .github/workflows/oneui-build.yml
          check ID application_id git grep -q app.lawnchair.oneui -- .github/workflows/oneui-build.yml
          check ID stable_keystore git grep -q ONEUI_KEYSTORE_B64 -- .github/workflows/oneui-build.yml
          check ID apksigner git grep -q apksigner -- .github/workflows/oneui-build.yml
          echo "semantic_fail=$FAIL" >> "$GITHUB_OUTPUT"
          echo "SEMANTIC_CHECKS_COMPLETE fail=$FAIL"
          exit 0
      - name: Report upstream overlap with OneUI implementation
        run: |
          set -euo pipefail
          BASE=$(git merge-base "$ONEUI_BASE_SHA" "$UPSTREAM_SHA")
          git diff --name-only "$BASE" "$ONEUI_BASE_SHA" | sort > /tmp/oneui-files
          git diff --name-only "$BASE" "$UPSTREAM_SHA" | sort > /tmp/upstream-files
          comm -12 /tmp/oneui-files /tmp/upstream-files | tee /tmp/overlap || true
          echo "OneUI changed files: $(wc -l < /tmp/oneui-files)"
          echo "Upstream changed files: $(wc -l < /tmp/upstream-files)"
          echo "Overlap requiring semantic attention: $(wc -l < /tmp/overlap)"
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile reconstructed candidate
        id: build
        continue-on-error: true
        run: ./gradlew assembleLawnWithQuickstepGithubDebug --stacktrace
      - name: Final audit verdict
        if: always()
        run: |
          echo '=========================================='
          echo " Semantic checks fail flag: ${{ steps.semantic.outputs.semantic_fail }}"
          echo " Build outcome: ${{ steps.build.outcome }}"
          echo '=========================================='
          test "${{ steps.semantic.outputs.semantic_fail }}" = "0"
          test "${{ steps.build.outcome }}" = "success"
          echo ' ONEUI 16-DEV SEMANTIC AUDIT = PASS'
