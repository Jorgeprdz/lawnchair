name: OneUI separate build

on:
  push:
    branches:
      - feature/oneui-next
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-oneui-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.ONEUI_KEYSTORE_B64 || secrets.ONEUI_KEYSTORE || secrets.STABLE_KEYSTORE_B64 || secrets.STABLE_KEYSTORE || secrets.KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.ONEUI_STORE_PASSWORD || secrets.ONEUI_KEYSTORE_PASSWORD || secrets.STABLE_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ONEUI_KEY_ALIAS || secrets.STABLE_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ONEUI_KEY_PASSWORD || secrets.STABLE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "Stable signing secrets are incomplete."
            echo "Expected ONEUI_* secrets (or compatible fallback names)."
            exit 1
          fi

          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/oneui-stable.jks"
          cat > keystore.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storeFile=$GITHUB_WORKSPACE/oneui-stable.jks
          EOF

      - name: Test themed icon state and glass behavior
        run: ./gradlew testLawnWithQuickstepGithubDebugUnitTest --no-daemon

      - name: Build OneUI debug and instrumentation APKs
        run: ./gradlew assembleLawnWithQuickstepGithubDebug assembleLawnWithQuickstepGithubDebugAndroidTest --no-daemon

      - name: Verify package and signing certificate
        run: |
          set -euo pipefail
          APK="$(find build/outputs/apk -type f -name '*.apk' ! -path '*androidTest*' | head -n1)"
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"

          "$AAPT" dump badging "$APK" | grep "package: name='app.lawnchair.debug'"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/oneui-cert.txt
          grep -Fi 'b19449e782c304983e6a1686bae0089f25c62d33e8ed1be10931f12eb7a82eca' /tmp/oneui-cert.txt

      - name: Stage installable APK
        run: |
          set -euo pipefail
          APK="$(find build/outputs/apk -type f -name '*.apk' ! -path '*androidTest*' | head -n1)"
          mkdir -p oneui-artifact
          cp "$APK" oneui-artifact/Lawnchair-OneUI-Next-Nightly.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: Lawnchair-OneUI-Next-Nightly
          path: oneui-artifact/Lawnchair-OneUI-Next-Nightly.apk
          if-no-files-found: error
