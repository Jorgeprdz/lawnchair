name: CI

on:
  push:
    branches:
      - '*-dev'
    paths-ignore:
      - '.idea/**'
      - '.gitattributes'
      - '.github/**.json'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
    paths-ignore:
      - '.idea/**'
      - '.gitattributes'
      - '.github/**.json'
      - '.gitignore'
      - '.gitmodules'
      - '**.md'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:
    inputs:
      oneui-emulator:
        description: Run preliminary OneUI Android instrumentation on a remote emulator
        type: boolean
        default: false
      oneui-fast:
        description: Validate GithubDebug and instrumentation only (full matrix remains the default)
        type: boolean
        default: false
      oneui-max-restore-only:
        description: Run only the remaining Max item recreation regression
        type: boolean
        default: false
      oneui-apk-run:
        description: Reuse a successful APK run for emulator-only changes (source identity is checked)
        type: string
        default: ''
  workflow_call:

env:
  PUBLISH_NIGHTLY: true

jobs:
  build-debug-apk:
    if: ${{ !inputs.oneui-apk-run && !(github.event_name == 'pull_request' && github.head_ref == 'feature/oneui-enhancements') }}
    strategy:
      matrix:
        build-variant: ${{ fromJSON((inputs.oneui-fast || (github.event_name == 'push' && github.ref == 'refs/heads/feature/oneui-enhancements')) && '["assembleLawnWithQuickstepGithubDebug"]' || '["assembleLawnWithQuickstepNightlyRelease","assembleLawnWithQuickstepGithubDebug","assembleLawnWithQuickstepPlayDebug"]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch && github.ref != 'refs/heads/feature/oneui-enhancements' }}
          cache-encryption-key: Da25KUVSE5jbGds2zXmfXw==
      - name: Write sign info
        if: github.repository_owner == 'LawnchairLauncher'
        run: |
          if [ ! -z "${{ secrets.KEYSTORE }}" ]; then
            echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> keystore.properties
            echo keyAlias='${{ secrets.KEY_ALIAS }}' >> keystore.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> keystore.properties
            echo storeFile='${{ github.workspace }}/key.jks' >> keystore.properties
            echo ${{ secrets.KEYSTORE }} | base64 --decode > ${{ github.workspace }}/key.jks
          fi
      - name: Build APK
        run: ./gradlew ${{ matrix.build-variant }}
      - name: Build OneUI instrumentation APK
        if: matrix.build-variant == 'assembleLawnWithQuickstepGithubDebug'
        run: ./gradlew assembleLawnWithQuickstepGithubDebugAndroidTest
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.build-variant }}
          path: build/outputs/apk/**/*.apk

  oneui-emulator:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.oneui-emulator && github.ref == 'refs/heads/feature/oneui-enhancements' && (inputs.oneui-apk-run != '' || (needs.build-debug-apk.result == 'success' && needs.check-style.result == 'success'))
    needs: [build-debug-apk, check-style]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21
      - name: Verify reused APK source and successful build
        if: inputs.oneui-apk-run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ONEUI_APK_RUN: ${{ inputs.oneui-apk-run }}
        run: python3 .github/scripts/verify-oneui-apk.py
      - uses: actions/download-artifact@v8
        with:
          name: assembleLawnWithQuickstepGithubDebug
          path: oneui-apks
          run-id: ${{ inputs.oneui-apk-run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Run Android host regression tests
        env:
          ONEUI_MAX_RESTORE_ONLY: ${{ inputs.oneui-max-restore-only }}
        run: bash .github/scripts/oneui-emulator-smoke.sh
      - name: Preserve emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Lawnchair-OneUI-Emulator-Smoke
          path: oneui-emulator-results/
          if-no-files-found: error
      - name: Upload actual emulator screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Lawnchair-OneUI-Screenshots
          path: oneui-screenshots/*.png
          if-no-files-found: warn

  check-style:
    if: ${{ !inputs.oneui-apk-run && !(github.event_name == 'pull_request' && github.head_ref == 'feature/oneui-enhancements') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch && github.ref != 'refs/heads/feature/oneui-enhancements' }}
      - run: ./gradlew spotlessCheck

  send-notifications:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'LawnchairLauncher'
    needs: build-debug-apk
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install gitpython requests
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          pattern: assembleLawnWith*
          merge-multiple: true
          path: artifacts/debug-apk
      - name: Send notifications
        run: python ci.py
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_CI_BOT_TOKEN }}
          TELEGRAM_CI_CHANNEL_ID: ${{ secrets.TELEGRAM_CI_CHANNEL_ID }}
          TELEGRAM_TEAM_GROUP_ID: ${{ secrets.NOTIFY_CHANNEL_ID }}
          ARTIFACT_DIRECTORY: artifacts/debug-apk
          GITHUB_REF: ${{ github.ref }}
          ACTION: internal_notifications

  crowdin-auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'lawnchair-bot' && github.event.pull_request.title == 'New Crowdin translations by Github Action'
    needs: build-debug-apk
    steps:
      - env:
          GH_TOKEN: ${{ secrets.LAWNCHAIR_BOT_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment $PR_URL --body "No issues found, auto-merging the Crowdin pull request."
          gh pr merge $PR_URL --auto --squash --delete-branch

  # Status check that is required in branch protection rules.
  final-status:
    needs:
      - build-debug-apk
      - check-style
    runs-on: ubuntu-slim
    if: ${{ always() && !inputs.oneui-apk-run && !(github.event_name == 'pull_request' && github.head_ref == 'feature/oneui-enhancements') }}
    outputs:
      publish_nightly: ${{ steps.publishing-status.outputs.publish_nightly }}
    steps:
      - name: Check
        run: |
          results=$(tr -d '\n' <<< '${{ toJSON(needs.*.result) }}')
          if ! grep -q -v -E '(failure|cancelled)' <<< "$results"; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs completed successfully."
      - id: publishing-status
        run: echo "publish_nightly=${{ env.PUBLISH_NIGHTLY }}" >> "$GITHUB_OUTPUT"

  nightly-release:
    runs-on: ubuntu-latest
    needs: final-status
    if: needs.final-status.outputs.publish_nightly == 'true' && github.repository_owner == 'LawnchairLauncher' && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && endsWith(github.ref, '-dev')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: assembleLawnWithQuickstepNightlyRelease
      # Note the # and () symbols are not supported in GitHub Release filenames, even manually
      - name: Export APK_NAME for later use
        run: echo "APK_NAME=Lawnchair.Debug.${{ github.ref_name }}.Nightly-CI_${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-7).apk" >> $GITHUB_ENV
      - name: Rename .apk file
        run: mv "./lawnWithQuickstepNightly/release/"*.apk "./$APK_NAME"
      - name: Delete release if exist then create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "nightly" && gh release delete "nightly" -y --cleanup-tag
          gh release create "nightly" "./$APK_NAME" -p -t "Lawnchair Nightly" --generate-notes
